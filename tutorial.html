<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tutorial — Grupo Barreto's</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --bg:#090A0D;--surface:#0F1117;--card:#151820;--border:#1E2130;
  --gold:#F5B800;--gold-dim:rgba(245,184,0,.12);
  --txt:#E8EAF0;--txt-dim:#6B7280;--txt-mid:#9CA3AF;
  --green:#22C55E;--red:#EF4444;--blue:#3B82F6;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px}

/* ─── LOGIN ─── */
#login-screen{width:100%;max-width:360px}
.form-title{font-family:'Syne',sans-serif;font-size:19px;font-weight:700;margin-bottom:6px}
.form-sub{font-size:12.5px;color:var(--txt-dim);margin-bottom:26px;line-height:1.5}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-dim);margin-bottom:5px}
.fi{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--txt);
  font-family:'DM Sans',sans-serif;font-size:13.5px;padding:11px 13px;outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--gold)}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-gold{background:var(--gold);color:#111}
.msg-err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:7px;padding:10px 13px;
  font-size:11.5px;color:var(--red);margin-bottom:14px;display:none}
.spinner{width:14px;height:14px;border:2px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── WIZARD ─── */
#wizard-screen{display:none;width:100%;max-width:640px}
.wz-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.wz-avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#111;font-family:'Syne',sans-serif;
  font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wz-who{flex:1;min-width:0}
.wz-who .n{font-size:13.5px;font-weight:600}
.wz-who .r{font-size:11px;color:var(--txt-dim)}
.wz-progress{font-size:11px;color:var(--txt-dim);white-space:nowrap}
.wz-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:28px}
.wz-bar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .25s}

.wz-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;min-height:340px;
  display:flex;flex-direction:column}
.wz-icon{width:46px;height:46px;border-radius:12px;background:var(--gold-dim);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:18px}
.wz-cat{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-dim);margin-bottom:6px}
.wz-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;margin-bottom:12px;text-wrap:balance}
.wz-lead{font-size:14px;color:var(--txt-mid);line-height:1.6;margin-bottom:18px}
.wz-section-ttl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-dim);
  margin:16px 0 8px}
.wz-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.wz-list li{font-size:13.5px;color:var(--txt);line-height:1.5;display:flex;gap:9px}
.wz-list li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:7px}
.wz-note{background:var(--gold-dim);border:1px solid var(--border);border-radius:10px;padding:12px 14px;
  font-size:12.5px;color:var(--txt);line-height:1.55;margin-top:18px}
.wz-note b{color:var(--gold)}
.wz-placeholder{background:var(--card);border:1px dashed var(--border);border-radius:10px;padding:16px;
  font-size:12.5px;color:var(--txt-dim);margin-top:auto}

.wz-foot{display:flex;align-items:center;gap:10px;margin-top:20px}
.wz-dots{flex:1;display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.wz-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .15s}
.wz-dot.done{background:var(--txt-dim)}
.wz-dot.active{background:var(--gold);width:16px;border-radius:3px}
.wz-btn{padding:10px 18px;border-radius:8px;font-family:'Syne',sans-serif;font-size:12.5px;font-weight:700;
  cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--txt-mid);transition:.15s;
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.wz-btn:hover{border-color:var(--gold);color:var(--gold)}
.wz-btn.primary{background:var(--gold);color:#111;border-color:var(--gold)}
.wz-btn.primary:hover{opacity:.88;color:#111}
.wz-skip{text-align:center;margin-top:14px;font-size:11.5px;color:var(--txt-dim)}
.wz-skip a{color:var(--txt-mid);text-decoration:underline;cursor:pointer}
.wz-skip a:hover{color:var(--gold)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="form-title">Tutorial do Sistema</div>
  <div class="form-sub">Entre com seu login normal do sistema — o tutorial identifica sozinho quais telas você tem acesso e te ensina só o que é seu.</div>
  <div class="msg-err" id="msg-err"></div>
  <div class="fg"><label>Usuário</label><input class="fi" id="lg-login" placeholder="seu login" autocomplete="username"></div>
  <div class="fg"><label>Senha</label><input class="fi" id="lg-senha" type="password" placeholder="••••••••" autocomplete="current-password"></div>
  <button class="btn btn-gold" id="btn-login" onclick="doLogin()"><i class="ti ti-login" style="font-size:14px"></i> Começar o tutorial</button>
</div>

<div id="wizard-screen">
  <div class="wz-head">
    <div class="wz-avatar" id="wz-avatar">?</div>
    <div class="wz-who"><div class="n" id="wz-nome">—</div><div class="r" id="wz-perfil">—</div></div>
    <div class="wz-progress" id="wz-progress">Passo 1 de 1</div>
  </div>
  <div class="wz-bar"><div class="wz-bar-fill" id="wz-bar-fill" style="width:0%"></div></div>

  <div class="wz-card" id="wz-card"></div>

  <div class="wz-foot">
    <button class="wz-btn" id="wz-btn-back" onclick="wzVoltar()"><i class="ti ti-chevron-left"></i> Voltar</button>
    <div class="wz-dots" id="wz-dots"></div>
    <button class="wz-btn primary" id="wz-btn-next" onclick="wzProximo()">Próximo <i class="ti ti-chevron-right"></i></button>
  </div>
  <div class="wz-skip"><a onclick="irParaSistema()">Pular e ir direto pro sistema</a></div>
</div>

<script>
var SUPABASE_URL = 'https://qjwobkpgqmaqisphwonl.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_c4MrJXB6nTHY0a5ShAFRaQ_Jc4qDdPr';

function loginParaEmail(login) {
  if (login.indexOf('@') !== -1) return login;
  var normalizado = login.toLowerCase().trim()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\s+/g, '.')
    .replace(/[^a-z0-9.]/g, '');
  return normalizado + '@barretos.sistema';
}
function setErr(msg){
  var e=document.getElementById('msg-err');
  e.style.display = msg ? 'block' : 'none';
  e.textContent = msg || '';
}

/* ══════════════════════════════
   LOGIN — mesmo fluxo do login.html: autentica direto no Supabase e lê
   nome/perfil/ferramentas da própria conta. Guarda nas mesmas chaves do
   localStorage que o resto do sistema usa, então quem faz o tutorial já
   sai logado quando for pro sistema de verdade.
══════════════════════════════ */
async function doLogin(){
  var digitado = document.getElementById('lg-login').value.trim();
  var senha = document.getElementById('lg-senha').value;
  if(!digitado||!senha){ setErr('Preencha usuário e senha.'); return; }
  var btn = document.getElementById('btn-login');
  btn.innerHTML = '<span class="spinner"></span> Entrando…'; btn.disabled = true;
  setErr('');
  try{
    var r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{'Content-Type':'application/json', apikey: SUPABASE_ANON_KEY},
      body: JSON.stringify({ email: loginParaEmail(digitado), password: senha }),
    });
    var j = await r.json();
    if(r.ok && j.access_token){
      var pr = await fetch(
        SUPABASE_URL + '/rest/v1/usuarios?select=nome,login,perfil,permissoes(ferramentas)&auth_user_id=eq.' + j.user.id,
        { headers:{ apikey: SUPABASE_ANON_KEY, Authorization:'Bearer ' + j.access_token } }
      );
      var linhas = await pr.json();
      var perfilRow = Array.isArray(linhas) ? linhas[0] : null;
      var permRel = perfilRow && perfilRow.permissoes;
      var ferramentas = Array.isArray(permRel) ? ((permRel[0]&&permRel[0].ferramentas)||[]) : ((permRel&&permRel.ferramentas)||[]);
      var user = {
        nome:  (perfilRow&&perfilRow.nome)  || digitado,
        perfil:(perfilRow&&perfilRow.perfil)|| 'colaborador',
        login: (perfilRow&&perfilRow.login) || digitado,
      };
      sessionStorage.setItem('barretos_user', JSON.stringify(user));
      localStorage.setItem('barretos_nome',   user.nome);
      localStorage.setItem('barretos_perfil', user.perfil);
      localStorage.setItem('barretos_login',  user.login);
      localStorage.setItem('barretos_permissoes', JSON.stringify(ferramentas));
      localStorage.setItem('barretos_auth_token',   j.access_token);
      localStorage.setItem('barretos_auth_refresh', j.refresh_token);
      iniciarTutorial(user, ferramentas);
    } else {
      setErr(j.error_description || j.msg || 'Login ou senha incorretos.');
    }
  } catch(e){ setErr('Erro de conexão com o Supabase.'); }
  btn.innerHTML = '<i class="ti ti-login" style="font-size:14px"></i> Começar o tutorial'; btn.disabled = false;
}

function normLoginLocal_(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
}
function ehUm_(user, tokens){
  var base = normLoginLocal_(user.nome) + ' ' + normLoginLocal_(user.login);
  return tokens.some(function(t){ return base.indexOf(t) === 0 || base.indexOf(' '+t) !== -1; });
}

/* ══════════════════════════════
   CONTEÚDO — um item por ferramenta. "detalhes(user)" recebe o usuário
   logado e devolve o conteúdo já adaptado ao papel dele naquela tela
   específica (ex: Faturamento e Financeiro mostram menos abas pra quem
   não é do time que aprova/paga).
══════════════════════════════ */
var EMPRESA_POR_FERRAMENTA_KANBAN = {
  kanban_pin: "Pinheiro", kanban_inf: "Infra", kanban_bar: "Barreto's", kanban_gon: "Gonçalves",
};

var MODULOS = {
  inicio: {
    label: 'Início', icon: 'ti-home', cat: 'Sempre disponível',
    lead: 'A tela que abre assim que você entra no sistema — um resumo rápido do mês (faturamento, margem, top 5 clientes) puxado direto dos quadros do Kanban.',
    pontos: ['Não precisa pedir liberação — todo mundo vê o Início.', 'Os números mudam conforme o mês selecionado no topo da tela.'],
  },
  calendario: {
    label: 'Calendário', icon: 'ti-calendar', cat: 'Sempre disponível',
    lead: 'Agenda compartilhada de toda a empresa — reuniões, compromissos e eventos recorrentes.',
    pontos: ['Todo mundo pode ver e criar eventos, e adicionar outras pessoas como participantes.', 'Quem é incluído num evento recebe um alerta automático na hora.'],
  },
  kanban: {
    label: 'Kanban (Operação)', icon: 'ti-columns', cat: 'Operacional',
    lead: 'O quadro onde cada frete é acompanhado do início ao fim, por empresa. As colunas hoje são Operacional → Coleta → Faturado → Finalizado.',
    pontos: [
      'Arraste o card entre as colunas conforme o frete avança.',
      'Quando o Faturamento emite o CT-e do card, ele já pula sozinho pra coluna Faturado — e quando o canhoto é conferido, pula pra Finalizado. Não precisa mais arrastar manualmente nessas duas etapas.',
      'Dentro do card, o botão "Baixar Todos" no rodapé baixa todos os anexos de una vez, num arquivo zip só.',
      'Ao lado das colunas tem um painel de Resumo (valor em aberto ainda não faturado, cards sem Vale Pedágio, sem Data de Coleta, coleta de amanhã) e um gráfico mostrando em quais dias do mês o faturamento se concentra.',
    ],
    detalhes: function(user, ferramentas){
      var empresas = ['kanban_pin','kanban_inf','kanban_bar','kanban_gon']
        .filter(function(k){ return ferramentas.indexOf(k)!==-1; })
        .map(function(k){ return EMPRESA_POR_FERRAMENTA_KANBAN[k]; });
      if(!empresas.length) return null;
      return { nota: 'Você tem acesso ao(s) quadro(s) de: <b>'+empresas.join(', ')+'</b>.' };
    },
  },
  cotacao: {
    label: 'Cotação Comercial', icon: 'ti-calculator', cat: 'Comercial',
    lead: 'Onde uma cotação de frete nasce, até ser aprovada e virar um card no Kanban automaticamente.',
    pontos: ['Cotações acima de 5% de desconto passam por aprovação em cascata (Filipe → Gabriel Pinheiro acima de 5% → Diego Flórido acima de 15%).', 'Quando aprovada, o card já nasce no Kanban com modalidade, tipo de material e dados do cliente preenchidos sozinhos.'],
  },
  relatorio: {
    label: 'Relatório de Vendedor', icon: 'ti-chart-bar', cat: 'Comercial',
    lead: 'Performance de cada vendedor — faturamento, margem, quantidade de fretes — filtrando por mês, vendedor, empresa ou cliente.',
    pontos: ['Os dados vêm direto dos cards do Kanban, sempre atualizados.', 'Jan/Fev/Mar de 2026 (período anterior à migração) aparecem somados automaticamente a partir de um histórico próprio.'],
  },
  crm: {
    label: 'CRM', icon: 'ti-target-arrow', cat: 'Comercial',
    lead: 'Funil comercial completo: prospecção de clientes, timeline de contato, metas da equipe e produtividade dos vendedores.',
    pontos: [],
  },
  clientes: {
    label: 'Clientes', icon: 'ti-users', cat: 'Comercial',
    lead: 'Cadastro central de clientes (CNPJ, contato, endereço) usado por Cotação, Faturamento e CRM.',
    pontos: [],
  },
  financeiro: {
    label: 'Financeiro', icon: 'ti-cash', cat: 'Financeiro',
    lead: 'Contas a pagar e a receber da empresa. O que você vê aqui depende do seu papel neste módulo específico.',
    pontos: [],
    detalhes: function(user){
      var master = ehUm_(user, ['lisa','daniel','alex sandro']);
      if(master){
        return { nota: '<b>Sua visão aqui é a completa (Gestão):</b> Dashboard, Fila do Dia, Histórico, Contas a Pagar e Contas a Receber — você processa e aprova os pagamentos.' };
      }
      return { nota: '<b>Sua visão aqui é simplificada:</b> você só vê a Fila do Dia (pra solicitar um pagamento) e o Histórico das suas próprias solicitações. Contas a Pagar/Receber ficam visíveis só pra Lisa, Daniel e Alex.' };
    },
  },
  faturamento: {
    label: 'Faturamento', icon: 'ti-file-invoice', cat: 'Financeiro',
    lead: 'Fila de emissão de CT-e a partir dos cards do Kanban, e depois a conferência do canhoto de entrega. O que você vê aqui também depende do seu papel.',
    pontos: [],
    detalhes: function(user){
      var vendedor = ehUm_(user, ['sabrina','leonardo']);
      if(vendedor){
        return { nota: '<b>Sua visão aqui é simplificada:</b> você só vê a Fila (pra solicitar faturamento de um card) e o Histórico, só leitura, das suas próprias solicitações.' };
      }
      return { nota: '<b>Sua visão aqui é a completa (Gestão):</b> Dashboard, Fila do Dia, Detalhamento e a análise de canhoto — inclui emitir o CT-e e conferir o canhoto que move o card pro Finalizado no Kanban.' };
    },
  },
  conciliacao: {
    label: 'Conciliação Bancária', icon: 'ti-building-bank', cat: 'Financeiro',
    lead: 'Classifica automaticamente os lançamentos do extrato bancário por categoria, aprendendo com o que já foi classificado antes.',
    pontos: ['Dá pra selecionar vários lançamentos e classificar todos de uma vez.'],
  },
  frota: {
    label: 'Gestão da Frota', icon: 'ti-truck', cat: 'Operacional',
    lead: 'Veículos, motoristas, viagens, combustível, manutenções e multas.',
    pontos: ['Na aba Viagens, dá pra selecionar um período e alterar o status de pagamento (À Vencer/Pago/Vencido) de todas as viagens filtradas de uma vez, sem precisar entrar em cada uma.'],
  },
  despesas: {
    label: 'Despesas', icon: 'ti-wallet', cat: 'Geral',
    lead: 'Despesas gerais da empresa (aluguel, energia, RH...) — separado da Frota.',
    pontos: [],
  },
  diarias: {
    label: 'Diárias de Motoristas', icon: 'ti-calendar-check', cat: 'RH',
    lead: 'Controle de diárias pagas a motoristas por viagem.',
    pontos: [],
  },
  recrutamento: {
    label: 'Recrutamento e Seleção', icon: 'ti-user-search', cat: 'RH',
    lead: 'Vagas abertas e candidatos em processo seletivo.',
    pontos: [],
  },
  ideias: {
    label: 'Laboratório de Ideias', icon: 'ti-bulb', cat: 'Melhoria',
    lead: 'Onde qualquer um pode sugerir melhorias pro sistema ou pra operação.',
    pontos: [],
  },
  helpdesk: {
    label: 'Helpdesk', icon: 'ti-headset', cat: 'Melhoria',
    lead: 'Chamados internos de suporte (TI, sistema, dúvidas).',
    pontos: [],
  },
  config: {
    label: 'Configurações', icon: 'ti-settings', cat: 'Admin',
    lead: 'Criação de usuários e liberação de acesso por módulo — só quem é admin do sistema entra aqui.',
    pontos: [],
  },
};

var ORDEM = ['inicio','calendario','kanban','cotacao','relatorio','crm','clientes','financeiro','faturamento','conciliacao','frota','despesas','diarias','recrutamento','ideias','helpdesk','config'];

/* ══════════════════════════════
   WIZARD
══════════════════════════════ */
var wzPassos = [], wzIdx = 0;

function iniciarTutorial(user, ferramentas){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('wizard-screen').style.display = 'block';
  document.getElementById('wz-avatar').textContent = (user.nome||'?').charAt(0).toUpperCase();
  document.getElementById('wz-nome').textContent = user.nome || user.login;
  document.getElementById('wz-perfil').textContent = (user.perfil||'colaborador').replace(/^./, function(c){return c.toUpperCase();});

  wzPassos = [];
  var temAlgumKanban = ['kanban_pin','kanban_inf','kanban_bar','kanban_gon'].some(function(k){ return ferramentas.indexOf(k)!==-1; });

  ORDEM.forEach(function(chave){
    if(chave==='kanban'){
      if(temAlgumKanban) wzPassos.push({ chave:chave, mod:MODULOS.kanban, extra:MODULOS.kanban.detalhes(user, ferramentas) });
      return;
    }
    if(chave==='inicio' || chave==='calendario'){
      wzPassos.push({ chave:chave, mod:MODULOS[chave], extra:null });
      return;
    }
    if(ferramentas.indexOf(chave) === -1) return;
    var mod = MODULOS[chave];
    if(!mod) return;
    var extra = mod.detalhes ? mod.detalhes(user, ferramentas) : null;
    wzPassos.push({ chave:chave, mod:mod, extra:extra });
  });

  wzIdx = 0;
  wzRenderDots();
  wzRender();
}

function wzRenderDots(){
  var wrap = document.getElementById('wz-dots');
  wrap.innerHTML = wzPassos.map(function(_,i){
    return '<div class="wz-dot'+(i===wzIdx?' active':(i<wzIdx?' done':''))+'" onclick="wzIrPara('+i+')"></div>';
  }).join('');
}
function wzIrPara(i){ wzIdx = i; wzRender(); }

function wzRender(){
  var passo = wzPassos[wzIdx];
  var mod = passo.mod;
  document.getElementById('wz-progress').textContent = 'Passo '+(wzIdx+1)+' de '+wzPassos.length;
  document.getElementById('wz-bar-fill').style.width = (((wzIdx+1)/wzPassos.length)*100)+'%';

  var pontosHtml = (mod.pontos && mod.pontos.length)
    ? '<div class="wz-section-ttl">O que você pode fazer aqui</div><ul class="wz-list">'+mod.pontos.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ul>'
    : '';
  var notaHtml = passo.extra && passo.extra.nota
    ? '<div class="wz-note">'+passo.extra.nota+'</div>'
    : '';
  var vazioHtml = (!mod.pontos || !mod.pontos.length) && !notaHtml
    ? '<div class="wz-placeholder">Conteúdo detalhado desta tela ainda está sendo preparado — em breve entra aqui.</div>'
    : '';

  document.getElementById('wz-card').innerHTML =
    '<div class="wz-icon"><i class="ti '+mod.icon+'"></i></div>'+
    '<div class="wz-cat">'+mod.cat+'</div>'+
    '<div class="wz-title">'+mod.label+'</div>'+
    '<div class="wz-lead">'+mod.lead+'</div>'+
    pontosHtml + notaHtml + vazioHtml;

  document.getElementById('wz-btn-back').style.visibility = wzIdx===0 ? 'hidden' : 'visible';
  var btnNext = document.getElementById('wz-btn-next');
  if(wzIdx === wzPassos.length-1){
    btnNext.innerHTML = 'Concluir e ir pro sistema <i class="ti ti-arrow-right"></i>';
  } else {
    btnNext.innerHTML = 'Próximo <i class="ti ti-chevron-right"></i>';
  }
  wzRenderDots();
}

function wzVoltar(){ if(wzIdx>0){ wzIdx--; wzRender(); } }
function wzProximo(){
  if(wzIdx < wzPassos.length-1){ wzIdx++; wzRender(); }
  else irParaSistema();
}
function irParaSistema(){ window.location.href = 'shell.html'; }

/* Se a pessoa já estiver logada (mesma sessão do sistema, mesmo domínio),
   pula direto pro tutorial sem pedir login de novo. */
(function(){
  var nome = localStorage.getItem('barretos_nome');
  var login = localStorage.getItem('barretos_login');
  var perfil = localStorage.getItem('barretos_perfil');
  var ferramentasRaw = localStorage.getItem('barretos_permissoes');
  if(nome && login && ferramentasRaw){
    try{
      var ferramentas = JSON.parse(ferramentasRaw) || [];
      iniciarTutorial({ nome:nome, login:login, perfil:perfil||'colaborador' }, ferramentas);
    }catch(e){}
  }
})();
</script>
